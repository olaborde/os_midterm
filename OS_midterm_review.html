  active=true;const current=QUESTION_BANK.find(q=>q.id===state.ids[state.index]),scope=QUESTION_BANK.filter(q=>state.category==='all'||q.category===state.category),savedKnown=scope.filter(q=>state.ratings[q.id]==='known').length,savedAgain=scope.filter(q=>state.ratings[q.id]==='again').length,categories=[...new Set(QUESTION_BANK.map(q=>q.category))];
  $('#app').innerHTML=`<section class="flash-shell"><div class="game-top"><div><div class="eyebrow">STUDY AT YOUR OWN PACE</div><h2>Flashcards<span class="tiny"> / CGS1700</span></h2></div><button id="flash-exit" class="icon-btn">Back to game setup</button></div><div class="flash-toolbar"><div><label for="flash-topic">Study area</label><select id="flash-topic"><option value="all">All 50 questions</option>${categories.map(c=>`<option value="${esc(c)}" ${state.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div><label class="checkline"><input id="flash-review-filter" type="checkbox" ${state.reviewOnly?'checked':''}>Review again only (${savedAgain})</label><button id="flash-shuffle" class="btn secondary">Shuffle deck ↻</button></div><div class="flash-layout"><section><div class="round-track" aria-label="Pass progress"><span style="width:${state.complete?100:state.ids.length?state.index/state.ids.length*100:0}%"></span></div>${state.complete?`<div class="flash-finish"><div class="eyebrow">${state.ids.length?'PASS COMPLETE':'NO CARDS IN THIS PILE'}</div><h1>${state.ids.length?'A little more <em>confident.</em>':'A clear <em>review pile.</em>'}</h1><p>${state.ids.length?`You rated ${Object.keys(state.pass).length} of ${state.ids.length} cards in this pass. ${Object.values(state.pass).filter(v=>v==='known').length} marked “Got it” and ${Object.values(state.pass).filter(v=>v==='again').length} marked “Review again”.`:'Mark a card “Review again” during a full pass to add it here.'}</p><div class="flash-summary-actions"><button id="flash-all" class="btn">Study this topic again</button><button id="flash-again-pile" class="btn secondary" ${savedAgain?'':'disabled'}>Review again (${savedAgain})</button></div>${state.ids.length?'<button id="flash-return-last" class="icon-btn">← Back to last card</button>':''}</div>`:`<div class="flash-meta"><span>CARD ${String(state.index+1).padStart(2,'0')} / ${state.ids.length}</span><span>${esc(current.category)}</span></div><button id="flash-card" class="flash-card ${revealed?'is-revealed':''}" aria-label="${revealed?'Answer shown. Activate to show the question.':'Question shown. Activate to reveal the answer.'}" aria-pressed="${revealed}"><span class="flash-side">${revealed?'THE ANSWER':'THE QUESTION'}</span><span class="flash-main">${esc(revealed?current.options[current.answer]:current.question)}</span>${revealed?`<span class="flash-explanation">${esc(current.explanation)}</span>`:''}<span class="flash-flip-hint">${revealed?'↶ Show question':'↻ Reveal answer'}<span>Space or Enter</span></span></button><div class="flash-ratings"><button id="flash-again" class="btn secondary" ${revealed?'':'disabled'}>1 · Review again</button><button id="flash-known" class="btn" ${revealed?'':'disabled'}>2 · Got it</button></div><div class="flash-nav"><button id="flash-prev" class="icon-btn" ${state.index?'':'disabled'}>← Previous</button><span class="tiny">${state.ratings[current.id]==='known'?'Saved: Got it':state.ratings[current.id]==='again'?'Saved: Review again':'Reveal the answer, then rate your recall'}</span><button id="flash-next" class="icon-btn">${state.index===state.ids.length-1?'Finish pass':'Skip / next →'}</button></div>`}</section><aside class="sidebar flash-sidebar"><div class="sidebar-title">YOUR STUDY PROGRESS</div><div class="bank">${savedKnown}<span class="tiny"> / ${scope.length}</span></div><p class="compact-note">cards marked “Got it” in ${state.category==='all'?'all topics':'this topic'}</p><div class="flash-progress-bar" role="progressbar" aria-valuenow="${savedKnown}" aria-valuemin="0" aria-valuemax="${scope.length}" aria-label="Cards marked Got it"><span style="width:${savedKnown/scope.length*100}%"></span></div><div class="flash-count-row"><span>Got it</span><strong>${savedKnown}</strong></div><div class="flash-count-row"><span>Review again</span><strong>${savedAgain}</strong></div><div class="flash-count-row"><span>Not rated yet</span><strong>${scope.length-savedKnown-savedAgain}</strong></div><p class="compact-note">Read the question and try to recall the answer before flipping. Your ratings save on this browser.</p><button id="flash-reset" class="icon-btn">Reset flashcard progress</button><p class="compact-note">← → Navigate<br>Space / Enter · Flip<br>1 · Review again<br>2 · Got it</p></aside></div></section>`;
  $('#flash-exit').onclick=exit;$('#flash-topic').onchange=e=>begin(e.target.value,state.reviewOnly,state.shuffle);$('#flash-review-filter').onchange=e=>begin(state.category,e.target.checked,state.shuffle);$('#flash-shuffle').onclick=()=>begin(state.category,state.reviewOnly,true);
  if($('#flash-card')){$('#flash-card').onclick=flip;$('#flash-again').onclick=()=>rate('again');$('#flash-known').onclick=()=>rate('known');$('#flash-prev').onclick=()=>move(-1);$('#flash-next').onclick=()=>move(1)}
  if($('#flash-all'))$('#flash-all').onclick=()=>begin(state.category,false,state.shuffle);if($('#flash-again-pile'))$('#flash-again-pile').onclick=()=>begin(state.category,true,state.shuffle);if($('#flash-return-last'))$('#flash-return-last').onclick=()=>move(-1);
  $('#flash-reset').onclick=()=>{showModal('<h2>Reset flashcard progress?</h2><p>This clears all saved “Got it” and “Review again” ratings across the 50 flashcards. Your quiz scores and saved game stay separate.</p><button id="confirm-flash-reset" class="btn danger">Reset all flashcard ratings</button>');$('#confirm-flash-reset').onclick=()=>{closeModal();state.ratings={};begin(state.category,false,state.shuffle)}};
  $('#live').textContent=state.complete?'Flashcard pass complete':revealed?'Answer: '+current.options[current.answer]:'Card '+(state.index+1)+'. '+current.question;
 }
 document.addEventListener('keydown',e=>{if(!active||$('#modal').open||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)||e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key.toLowerCase();if((k===' '||k==='enter')&&e.target.tagName==='BUTTON'&&e.target.id!=='flash-card')return;if([' ','enter','arrowleft','arrowright','1','2'].includes(k))e.preventDefault();if(k===' '||k==='enter')flip();if(k==='arrowleft')move(-1);if(k==='arrowright')move(1);if(k==='1')rate('again');if(k==='2')rate('known');if(k==='m')$('#sound').click();if(k==='f')$('#fullscreen').click()});
 window.FlashcardUI={open,isActive:()=>active,deactivate:()=>{active=false}};
})();

</script>
